[DATABASE]
user            = system
password        = 1234
connect_string  = localhost:1521/XEPDB1

; ─────────────────────────────────────────────────────────────
;  STUDENT  –  verify / fetch
;  DB columns: student_id, course_code, year_level, section
; ─────────────────────────────────────────────────────────────
[VERIFY_STUDENT]
check_existing =
    SELECT COUNT(*) AS CNT
    FROM system.Students
    WHERE STUDENT_ID = :student_id

fetch_student =
    SELECT
        STUDENT_ID,
        COURSE_CODE,
        YEAR_LEVEL,
        SECTION
    FROM system.Students
    WHERE STUDENT_ID = :student_id

; ─────────────────────────────────────────────────────────────
;  STUDENT  –  register (INSERT)
;  DB columns: student_id, course_code, year_level, section
; ─────────────────────────────────────────────────────────────
[REGISTER_STUDENT]
insert_student =
    INSERT INTO system.Students (
        STUDENT_ID,
        COURSE_CODE,
        YEAR_LEVEL,
        SECTION
    ) VALUES (
        :student_id,
        :course_code,
        :year_level,
        :section
    )

; ─────────────────────────────────────────────────────────────
;  EVALUATION  –  admin reports
; ─────────────────────────────────────────────────────────────
[EVALUATION]
; Summary: all professors with how many students evaluated vs total enrolled
fetch_all_evaluations =
    SELECT
        p.NAME                      AS PROFESSOR_NAME,
        s.SUBJECT_CODE,
        s.SUBJECT_NAME,
        c.SECTION,
        c.SCHOOL_YEAR,
        COUNT(ev.EVALUATION_ID)     AS EVAL_COUNT,
        COUNT(e.ENROLLMENT_ID)      AS TOTAL_ENROLLED
    FROM system.Professors p
    JOIN system.Classes     c   ON p.PROFESSOR_ID  = c.PROFESSOR_ID
    JOIN system.Subjects    s   ON c.SUBJECT_CODE  = s.SUBJECT_CODE
    JOIN system.Enrollments e   ON c.CLASS_ID      = e.CLASS_ID
    LEFT JOIN system.Evaluations ev ON e.ENROLLMENT_ID = ev.ENROLLMENT_ID
    GROUP BY
        p.NAME,
        s.SUBJECT_CODE,
        s.SUBJECT_NAME,
        c.SECTION,
        c.SCHOOL_YEAR
    ORDER BY p.NAME, s.SUBJECT_CODE

; Per-question average ratings for a specific professor
fetch_professor_detail =
    SELECT
        cat.CATEGORY_NAME,
        q.QUESTION_TEXT,
        ROUND(AVG(r.RATING), 2)  AS AVG_RATING,
        COUNT(r.RESPONSE_ID)     AS RESPONSE_COUNT
    FROM system.Professors p
    JOIN system.Classes      c   ON p.PROFESSOR_ID   = c.PROFESSOR_ID
    JOIN system.Enrollments  e   ON c.CLASS_ID       = e.CLASS_ID
    JOIN system.Evaluations  ev  ON e.ENROLLMENT_ID  = ev.ENROLLMENT_ID
    JOIN system.Responses    r   ON ev.EVALUATION_ID = r.EVALUATION_ID
    JOIN system.Questions    q   ON r.QUESTION_ID    = q.QUESTION_ID
    JOIN system.Categories   cat ON q.CATEGORY_ID    = cat.CATEGORY_ID
    WHERE UPPER(p.NAME) LIKE UPPER(:professor_name)
    GROUP BY cat.CATEGORY_NAME, q.QUESTION_TEXT
    ORDER BY cat.CATEGORY_NAME, q.QUESTION_TEXT

; Overall average rating per professor (simple overview)
fetch_avg_ratings =
    SELECT
        p.NAME                      AS PROFESSOR_NAME,
        ROUND(AVG(r.RATING), 2)     AS AVG_RATING,
        COUNT(r.RESPONSE_ID)        AS TOTAL_RESPONSES
    FROM system.Professors p
    JOIN system.Classes      c   ON p.PROFESSOR_ID   = c.PROFESSOR_ID
    JOIN system.Enrollments  e   ON c.CLASS_ID       = e.CLASS_ID
    JOIN system.Evaluations  ev  ON e.ENROLLMENT_ID  = ev.ENROLLMENT_ID
    JOIN system.Responses    r   ON ev.EVALUATION_ID = r.EVALUATION_ID
    WHERE r.RATING IS NOT NULL
    GROUP BY p.NAME
    ORDER BY AVG_RATING DESC

; Remarks for a specific professor
fetch_remarks =
    SELECT
        p.NAME          AS PROFESSOR_NAME,
        s.SUBJECT_CODE,
        ev.DATE_SUBMITTED,
        rm.REMARKS_TEXT
    FROM system.Evaluations  ev
    JOIN system.Enrollments  e   ON ev.ENROLLMENT_ID = e.ENROLLMENT_ID
    JOIN system.Classes      c   ON e.CLASS_ID       = c.CLASS_ID
    JOIN system.Professors   p   ON c.PROFESSOR_ID   = p.PROFESSOR_ID
    JOIN system.Subjects     s   ON c.SUBJECT_CODE   = s.SUBJECT_CODE
    LEFT JOIN system.Remarks rm  ON rm.EVALUATION_ID = ev.EVALUATION_ID
    WHERE UPPER(p.NAME) LIKE UPPER(:professor_name)
    ORDER BY ev.DATE_SUBMITTED DESC

